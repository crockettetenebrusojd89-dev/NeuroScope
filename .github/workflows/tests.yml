name: validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python numerical and API tests
        run: python -m pytest -q
      - name: Frontend syntax, i18n, routing and rendered regressions
        run: node tests/validate_frontend.mjs
      - name: Documentation and release assets
        run: node tests/validate_docs.mjs
      - name: Isolated app startup and real HTTP smoke
        run: python tests/validate_live.py
